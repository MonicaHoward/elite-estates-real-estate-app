{% extends base.html}
{% block title %} Listings - Elite Estates {% endblock %}

{% block content %}
<section class="page-header">
    <h1>Browse Listings</h1>
</section>

<div class="listings-layout">
    <h3>Filter</h3>
    <form method="get" action="{{ url_for('properties')}}">

        <label>City
            <input type="text" name="city" value="{{ filters.get('city', '')}}" placeholder="e.g. Dallas">
        </label>

        <label>Type
            <select name="type">
                <option value="">Any</option>"
                {% for type in ['house', 'condo', 'townhouse', 'land', 'commercial'] %}
                <option value=""{{type}} {% if filters.get('type')===type %}selected {% endif %}>{{type.title()}}</option>
                {% endfor %}
            </select>
        </label>
    </form>
</div>
